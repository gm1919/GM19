name: GM Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Flutter 3.47.2
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Create Flutter project
        run: |
          if [ ! -f pubspec.yaml ]; then
            flutter create \
              --project-name gmmanager \
              --org com.gmmanager \
              --platforms android \
              .
          fi

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          flutter --version
          dart --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GM Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
