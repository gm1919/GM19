DART

      - name: Verify Flutter project
        working-directory: gmmanager
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d android
          flutter --version
          dart --version

      - name: Get Flutter packages
        working-directory: gmmanager
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: gmmanager
        run: flutter analyze

      - name: Build release APK
        working-directory: gmmanager
        run: flutter build apk --release

      - name: Verify APK
        working-directory: gmmanager
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GM Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: GMManager-release-APK
          path: gmmanager/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
